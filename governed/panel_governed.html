<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EVALIA — Experimentos</title>
<style>body{background:#080d17;color:#eee;font:16px system-ui;margin:24px}header{max-width:1200px}#jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}article{background:#142033;padding:20px;border-radius:16px;overflow-wrap:anywhere}progress{width:100%;accent-color:#8957ff}a{color:#b6a1ff}small{display:block;color:#b9c8df}#error{color:#ffb5ad}</style>
<header><h1>Experimentos de EVALIA</h1><p id="mode">Consultando progreso…</p><p id="money"></p><p id="error" role="alert"></p></header><main id="jobs"></main>
<script>
const money=n=>'US$'+(Number(n||0)/1e9).toFixed(8);const labels={running:'Evaluando',queued:'En cola',budget_stopped:'Detenido por presupuesto',pending_reconciliation:'Pendiente de conciliación',complete:'Completado',complete_requires_review:'Lecturas completas; revisar indicadores',awaiting_authorization:'Sin autorización',stopped_requires_review:'Detenido; requiere revisión'};
function node(tag,text){let n=document.createElement(tag);n.textContent=text;return n}
async function refresh(){try{let r=await fetch('/api/multi/status',{cache:'no-store'});if(!r.ok)throw Error('No se pudo consultar el servidor');let s=await r.json();document.querySelector('#mode').textContent=s.execution_enabled===false?'Ejecucion pausada: falta autorizacion economica':s.simulation_only?'ENTORNO AISLADO — datos y gastos simulados':'Evaluaciones autorizadas';let spent=s.history.spent+s.jobs.reduce((a,j)=>a+j.spent,0),held=s.history.held+s.jobs.reduce((a,j)=>a+j.pending,0);document.querySelector('#money').textContent=`Gasto: ${money(spent)} · Reservas: ${money(held)} · Restante global: ${money(s.global_cap-spent-held)}`;let root=document.querySelector('#jobs');root.replaceChildren();for(let j of s.jobs){let a=node('article','');a.append(node('h2','Experimento #'+j.experiment),node('p',(labels[j.display_status||j.status]||j.status)+(j.budget_pause?' · Presupuesto '+({global:'global',individual:'individual',global_and_individual:'global e individual'}[j.budget_pause.reason]||j.budget_pause.reason):'')));let p=document.createElement('progress');p.max=j.total;p.value=j.completed;a.append(p,node('p',`${j.responses_saved} de ${j.response_total} respuestas analizadas · ${j.definitive_responses||0} definitivas`),node('p',`${j.completed} de ${j.total} lecturas`),node('p',`Gasto ${money(j.spent+(j.historical_spent||0))} · Reserva ${money(j.pending+(j.historical_reserved||0))} · Restante ${money(j.cap-j.spent-j.pending-(j.historical_spent||0)-(j.historical_reserved||0))}`),node('small',`${j.blocked_indicators||0} indicadores BLOCKED; no se convierten en puntuaciones`));let link=node('a','Ver tablas, indicadores y exportaciones');link.href=j.results_url;a.append(link);root.append(a)}document.querySelector('#error').textContent=''}catch(e){document.querySelector('#error').textContent=e.message+'; se conservan los datos mostrados.'}}
refresh();setInterval(refresh,3000);
</script></html>
